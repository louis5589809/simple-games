<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Desert Rocket League Octane Driving Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            user-select: none;
            background-color: #e6a15c;
            font-family: 'Inter', sans-serif;
        }
        #game-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .hud-glass {
            background: rgba(20, 15, 30, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="w-full h-full relative overflow-hidden">

    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Click to Focus / Play Overlay -->
    <div id="start-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/60 z-50 cursor-pointer">
        <div class="hud-glass p-8 rounded-2xl text-center max-w-md border border-amber-500/30 shadow-2xl">
            <h1 class="text-4xl font-black text-amber-400 italic tracking-wider mb-2">OCTANE DESERT DRIFT</h1>
            <p class="text-amber-100/80 mb-6 text-sm">Responsive Rocket-Style 3D Physics</p>
            <button id="play-btn" class="px-8 py-3 bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold text-lg rounded-xl shadow-lg transform hover:scale-105 transition">
                CLICK TO DRIVE
            </button>
            <div class="mt-6 text-xs text-amber-200/60 grid grid-cols-2 gap-2 text-left">
                <div><span class="font-bold text-amber-400">W / Up Arrow:</span> Accelerate</div>
                <div><span class="font-bold text-amber-400">S / Down Arrow:</span> Reverse / Brake</div>
                <div><span class="font-bold text-amber-400">A / D or Left/Right:</span> Steer</div>
                <div><span class="font-bold text-amber-400">Space / Shift:</span> Drift / Slip</div>
            </div>
        </div>
    </div>

    <!-- HUD Overlay -->
    <div class="absolute inset-0 pointer-events-none p-6 flex flex-col justify-between z-10">
        <!-- Top Info Header -->
        <div class="flex justify-between items-start">
            <div class="hud-glass px-5 py-3 rounded-xl text-white">
                <div class="text-xs uppercase tracking-widest text-amber-400 font-bold">CONTROLS</div>
                <div class="text-sm font-medium">WASD / Arrow Keys to Drive | Space to Drift</div>
            </div>
            <div class="hud-glass px-5 py-3 rounded-xl text-right text-white">
                <div class="text-xs uppercase tracking-widest text-amber-400 font-bold">MODE</div>
                <div class="text-sm font-medium text-emerald-400">Desert Free Roam</div>
            </div>
        </div>

        <!-- Bottom Speedometer & Boost Bar -->
        <div class="flex justify-between items-end">
            <!-- Speed Gauge -->
            <div class="hud-glass p-5 rounded-2xl text-white flex items-baseline space-x-2">
                <span id="speed-val" class="text-6xl font-black tracking-tight text-amber-400">0</span>
                <span class="text-lg font-bold text-amber-200/80">KM/H</span>
            </div>

            <!-- Drift/Boost Gauge -->
            <div class="hud-glass p-4 rounded-2xl w-64 space-y-2">
                <div class="flex justify-between text-xs font-bold text-amber-300">
                    <span>DRIFT READY</span>
                    <span id="drift-status" class="text-emerald-400">GRIP</span>
                </div>
                <div class="w-full bg-gray-800 rounded-full h-3 overflow-hidden border border-amber-500/30">
                    <div id="boost-bar" class="bg-gradient-to-r from-amber-500 via-orange-500 to-red-500 h-full w-0 transition-all duration-75"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global Input State Array/Object
        const keys = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            drift: false
        };

        // Window Focus & Event Listeners for reliable key registration
        function handleKeyDown(e) {
            const key = e.key.toLowerCase();
            if (key === 'w' || e.key === 'ArrowUp') keys.forward = true;
            if (key === 's' || e.key === 'ArrowDown') keys.backward = true;
            if (key === 'a' || e.key === 'ArrowLeft') keys.left = true;
            if (key === 'd' || e.key === 'ArrowRight') keys.right = true;
            if (e.key === ' ' || e.key === 'Shift') keys.drift = true;
        }

        function handleKeyUp(e) {
            const key = e.key.toLowerCase();
            if (key === 'w' || e.key === 'ArrowUp') keys.forward = false;
            if (key === 's' || e.key === 'ArrowDown') keys.backward = false;
            if (key === 'a' || e.key === 'ArrowLeft') keys.left = false;
            if (key === 'd' || e.key === 'ArrowRight') keys.right = false;
            if (e.key === ' ' || e.key === 'Shift') keys.drift = false;
        }

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        // Click-to-focus overlay handler
        const overlay = document.getElementById('start-overlay');
        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            window.focus();
        });

        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe6a15c);
        scene.fog = new THREE.FogExp2(0xe6a15c, 0.003);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffeedd, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        dirLight.position.set(100, 150, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 500;
        const d = 150;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // Ground Sand Plane
        const groundGeo = new THREE.PlaneGeometry(1000, 1000, 64, 64);
        const posAttr = groundGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            const x = posAttr.getX(i);
            const y = posAttr.getY(i);
            const z = Math.sin(x * 0.02) * Math.cos(y * 0.02) * 3 + Math.sin(x * 0.005) * 8;
            posAttr.setZ(i, z);
        }
        groundGeo.computeVertexNormals();
        const groundMat = new THREE.MeshStandardMaterial({ color: 0xd99b50, roughness: 0.9, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Smooth Asphalt Track Construction
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, 0.5, 0),
            new THREE.Vector3(120, 0.5, 80),
            new THREE.Vector3(220, 0.5, -40),
            new THREE.Vector3(100, 0.5, -180),
            new THREE.Vector3(-120, 0.5, -150),
            new THREE.Vector3(-200, 0.5, 20),
            new THREE.Vector3(-80, 0.5, 120)
        ], true);

        const trackPoints = curve.getSpacedPoints(300);
        const trackGeo = new THREE.BufferGeometry().setFromPoints(trackPoints);
        
        // Ribbon Geometry for track ribbon
        const trackWidth = 16;
        const trackRibbonGeo = new THREE.PlaneGeometry(trackWidth, 1, 1, 300);
        const ribbonPos = trackRibbonGeo.attributes.position;
        
        for (let i = 0; i <= 300; i++) {
            const p = curve.getPointAt(i / 300);
            const tangent = curve.getTangentAt(i / 300);
            const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

            // Left vertex
            const pLeft = p.clone().addScaledVector(side, trackWidth / 2);
            ribbonPos.setXYZ(i * 2, pLeft.x, pLeft.y + 0.1, pLeft.z);

            // Right vertex
            const pRight = p.clone().addScaledVector(side, -trackWidth / 2);
            ribbonPos.setXYZ(i * 2 + 1, pRight.x, pRight.y + 0.1, pRight.z);
        }
        trackRibbonGeo.computeVertexNormals();
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.8, side: THREE.DoubleSide });
        const trackMesh = new THREE.Mesh(trackRibbonGeo, trackMat);
        trackMesh.receiveShadow = true;
        scene.add(trackMesh);

        const carGroup = new THREE.Group();
        scene.add(carGroup);

        // Body Chassis (Extruded Aggressive Shape)
        const shape = new THREE.Shape();
        shape.moveTo(-1.2, 0);
        shape.lineTo(1.2, 0);
        shape.lineTo(1.1, 0.7);
        shape.lineTo(0.2, 1.1);
        shape.lineTo(-0.8, 1.1);
        shape.lineTo(-1.2, 0.5);

        const extrudeSettings = { depth: 2.2, bevelEnabled: true, bevelSegments: 3, steps: 2, bevelSize: 0.1, bevelThickness: 0.1 };
        const bodyGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        bodyGeo.center();
        const carMat = new THREE.MeshStandardMaterial({ color: 0x0077ff, metalness: 0.7, roughness: 0.2 });
        const carBody = new THREE.Mesh(bodyGeo, carMat);
        carBody.rotation.y = Math.PI / 2;
        carBody.position.y = 0.8;
        carBody.castShadow = true;
        carGroup.add(carBody);

        // Racing Stripes
        const stripeGeo = new THREE.BoxGeometry(0.6, 0.05, 2.3);
        const stripeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
        const stripe = new THREE.Mesh(stripeGeo, stripeMat);
        stripe.position.set(0, 1.35, 0);
        carGroup.add(stripe);

        // Front Bull-Bar Bumper
        const bumperGeo = new THREE.BoxGeometry(1.8, 0.4, 0.5);
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.3 });
        const bumper = new THREE.Mesh(bumperGeo, metalMat);
        bumper.position.set(0, 0.5, 1.2);
        bumper.castShadow = true;
        carGroup.add(bumper);

        // Rear Spoiler / Wing
        const wingPlateGeo = new THREE.BoxGeometry(1.8, 0.08, 0.5);
        const wing = new THREE.Mesh(wingPlateGeo, carMat);
        wing.position.set(0, 1.6, -1.0);
        wing.castShadow = true;

        const strutGeo = new THREE.BoxGeometry(0.1, 0.5, 0.1);
        const strutL = new THREE.Mesh(strutGeo, metalMat);
        strutL.position.set(-0.6, 1.3, -1.0);
        const strutR = strutL.clone();
        strutR.position.x = 0.6;
        carGroup.add(wing, strutL, strutR);

        // Thruster Boost Pipes (Glowing)
        const pipeGeo = new THREE.CylinderGeometry(0.18, 0.22, 0.6, 16);
        const pipeMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 });
        const pipeL = new THREE.Mesh(pipeGeo, pipeMat);
        pipeL.rotation.x = Math.PI / 2;
        pipeL.position.set(-0.4, 0.7, -1.15);
        const pipeR = pipeL.clone();
        pipeR.position.x = 0.4;
        carGroup.add(pipeL, pipeR);

        // Thruster Flames
        const flameGeo = new THREE.ConeGeometry(0.16, 0.8, 12);
        const flameMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 });
        const flameL = new THREE.Mesh(flameGeo, flameMat);
        flameL.rotation.x = -Math.PI / 2;
        flameL.position.set(-0.4, 0.7, -1.6);
        flameL.visible = false;
        const flameR = flameL.clone();
        flameR.position.x = 0.4;
        carGroup.add(flameL, flameR);

        // Wheels Assembly
        const wheels = [];
        const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.35, 24);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
        const rimMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.1 });

        const wheelPositions = [
            { x: -0.95, y: 0.45, z: 0.75, front: true },
            { x: 0.95, y: 0.45, z: 0.75, front: true },
            { x: -0.95, y: 0.45, z: -0.75, front: false },
            { x: 0.95, y: 0.45, z: -0.75, front: false }
        ];

        wheelPositions.forEach((pos) => {
            const wheelPivot = new THREE.Group();
            wheelPivot.position.set(pos.x, pos.y, pos.z);

            const wheelMesh = new THREE.Mesh(wheelGeo, wheelMat);
            wheelMesh.rotation.z = Math.PI / 2;
            wheelMesh.castShadow = true;

            const rimMesh = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.05, 0.7), rimMat);
            rimMesh.rotation.z = Math.PI / 2;
            wheelMesh.add(rimMesh);

            wheelPivot.add(wheelMesh);
            carGroup.add(wheelPivot);
            wheels.push({ group: wheelPivot, mesh: wheelMesh, isFront: pos.front });
        });

        let speed = 0;
        const maxSpeed = 1.2; // ~120 KM/H max
        const maxReverse = -0.4;
        const acceleration = 0.015;
        const friction = 0.985;
        const turnSpeed = 0.035;
        let carHeading = 0;
        let driftFactor = 0;

        const speedHUD = document.getElementById('speed-val');
        const boostBar = document.getElementById('boost-bar');
        const driftStatus = document.getElementById('drift-status');

        function animate() {
            requestAnimationFrame(animate);

            // 1. Acceleration & Driving Logic
            if (keys.forward) {
                speed += acceleration;
                flameL.visible = true;
                flameR.visible = true;
            } else {
                flameL.visible = false;
                flameR.visible = false;
            }

            if (keys.backward) {
                speed -= acceleration * 0.8;
            }

            // Apply Friction
            speed *= friction;

            // Clamp Speed Limits
            if (speed > maxSpeed) speed = maxSpeed;
            if (speed < maxReverse) speed = maxReverse;

            // 2. Steering & Drift Logic
            const isDrifting = keys.drift && Math.abs(speed) > 0.1;
            const currentTurnSpeed = isDrifting ? turnSpeed * 1.5 : turnSpeed;

            if (keys.left) {
                carHeading += currentTurnSpeed * (speed >= 0 ? 1 : -1);
            }
            if (keys.right) {
                carHeading -= currentTurnSpeed * (speed >= 0 ? 1 : -1);
            }

            // Drift meter update
            if (isDrifting && (keys.left || keys.right)) {
                driftFactor = Math.min(driftFactor + 2, 100);
                driftStatus.innerText = "DRIFTING!";
                driftStatus.className = "text-amber-400 font-black animate-pulse";
            } else {
                driftFactor = Math.max(driftFactor - 3, 0);
                driftStatus.innerText = "GRIP";
                driftStatus.className = "text-emerald-400";
            }
            boostBar.style.width = driftFactor + '%';

            // 3. Position Updates
            carGroup.rotation.y = carHeading;
            carGroup.position.x += Math.sin(carHeading) * speed;
            carGroup.position.z += Math.cos(carHeading) * speed;

            // 4. Animate Wheels (Rotation & Steering)
            wheels.forEach(w => {
                w.mesh.rotation.x += speed * 2;
                if (w.isFront) {
                    let steerAngle = 0;
                    if (keys.left) steerAngle = 0.4;
                    if (keys.right) steerAngle = -0.4;
                    w.group.rotation.y = steerAngle;
                }
            });

            // 5. Smooth Camera Follow
            const camOffset = new THREE.Vector3(0, 5, -12);
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), carHeading);
            const targetCamPos = carGroup.position.clone().add(camOffset);
            
            camera.position.lerp(targetCamPos, 0.1);
            camera.lookAt(carGroup.position.clone().add(new THREE.Vector3(0, 1.2, 0)));

            // 6. Update HUD Speed Display
            const speedKMH = Math.round(Math.abs(speed) * 100);
            speedHUD.innerText = speedKMH;
            
            renderer.render(scene, camera);
        }

        // Window Resizing Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize animation frame loop
        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
