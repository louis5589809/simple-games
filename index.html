<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D PolyTrack Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">Use WASD or Arrow Keys to Drive</div>

    <script>
        // --- 1. SCENE & RENDERER SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. TRACK (LOW-POLY ROAD) ---
        const trackGroup = new THREE.Group();
        const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        
        // Loop to make a simple oval track out of road blocks
        const createTrackSegment = (x, z, rotY) => {
            const geo = new THREE.BoxGeometry(10, 0.5, 10);
            const mesh = new THREE.Mesh(geo, roadMaterial);
            mesh.position.set(x, 0, z);
            mesh.rotation.y = rotY;
            mesh.receiveShadow = true;
            trackGroup.add(mesh);
        };

        // Build a ground plane
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x55aa55 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.3;
        ground.receiveShadow = true;
        scene.add(ground);

        // Build a simple circuit
        for (let i = -50; i <= 50; i += 10) {
            createTrackSegment(i, -30, 0); // Straight 1
            createTrackSegment(i, 30, 0);  // Straight 2
        }
        for (let i = -30; i <= 30; i += 10) {
            createTrackSegment(-50, i, Math.PI / 2); // Curve 1
            createTrackSegment(50, i, Math.PI / 2);  // Curve 2
        }
        scene.add(trackGroup);

        // --- 4. CAR (POLY-STYLE MESH) ---
        const car = new THREE.Group();
        
        // Car Body
        const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff2222, roughness: 0.3 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.5;
        body.castShadow = true;
        car.add(body);

        // Cabin
        const cabinGeo = new THREE.BoxGeometry(1.6, 0.6, 2);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 1, -0.2);
        car.add(cabin);

        car.position.set(0, 0.5, -30); // Starting line position
        scene.add(car);

        // --- 5. DRIVING PHYSICS & CONTROLS ---
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };
        let speed = 0;
        let maxSpeed = 0.8;
        let acceleration = 0.02;
        let friction = 0.96;
        let turnSpeed = 0.04;

        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // --- 6. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Forward / Backward inputs
            if (keys.ArrowUp || keys.w) speed = Math.min(speed + acceleration, maxSpeed);
            if (keys.ArrowDown || keys.s) speed = Math.max(speed - acceleration, -maxSpeed / 2);

            // Friction
            speed *= friction;

            // Steering (only steer if moving)
            if (Math.abs(speed) > 0.01) {
                const dir = speed > 0 ? 1 : -1;
                if (keys.ArrowLeft || keys.a) car.rotation.y += turnSpeed * dir;
                if (keys.ArrowRight || keys.d) car.rotation.y -= turnSpeed * dir;
            }

            // Move Car Forward
            car.position.x += Math.sin(car.rotation.y) * speed;
            car.position.z += Math.cos(car.rotation.y) * speed;

            // Chase Camera
            const cameraOffset = new THREE.Vector3(
                -Math.sin(car.rotation.y) * 12,
                6,
                -Math.cos(car.rotation.y) * 12
            );
            camera.position.copy(car.position).add(cameraOffset);
            camera.lookAt(car.position);

            renderer.render(scene, camera);
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
